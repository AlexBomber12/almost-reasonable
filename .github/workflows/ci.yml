name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run local CI gate
        run: |
          result=0
          python -m acceptance.run || result=$?
          # Exit 2 means deterministic CI passed, release readiness is BLOCKED.
          # Any gate failure remains exit 1 and fails this job.
          if [[ "$result" != 0 && "$result" != 2 ]]; then exit "$result"; fi
      - name: Upload executed Stage 0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/stage0/
          if-no-files-found: error
