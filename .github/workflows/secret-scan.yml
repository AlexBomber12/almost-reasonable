name: Secret scan

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  gitleaks:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
      head_repo: ${{ steps.resolve.outputs.head_repo }}
      scan_exit: ${{ steps.scan.outputs.exit }}
    steps:
      - name: Check out trusted scanner revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: scanner
      - name: Resolve trusted workflow run and exact PR head
        if: github.event_name == 'workflow_run'
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scanner/scripts/security/trusted-check.mjs resolve
      - name: Check out complete history at resolved PR commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.resolve.outputs.head_repo }}
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: target
      - name: Check out complete history at pushed main commit
        if: github.event_name == 'push'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: target
      - name: Verify resolved PR commit
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
        run: test "$(git -C target rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify pushed main commit
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git -C target rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test scanner regressions and scan fetched history
        id: scan
        run: |
          bash scanner/scripts/security/test-secret-scan.sh
          node --test scanner/scripts/security/test-trusted-check.mjs
          status=0
          bash scanner/scripts/security/scan-secrets.sh target || status=$?
          echo "exit=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

  publish-trusted-check:
    if: always() && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    needs: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    steps:
      - name: Check out trusted publisher revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: scanner
      - name: Publish result on verified PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCAN_PR: ${{ needs.gitleaks.outputs.pr }}
          SCAN_SHA: ${{ needs.gitleaks.outputs.sha }}
          SCAN_HEAD_REPO: ${{ needs.gitleaks.outputs.head_repo }}
          SCAN_RESULT: ${{ needs.gitleaks.result }}
          SCAN_EXIT: ${{ needs.gitleaks.outputs.scan_exit }}
        run: node scanner/scripts/security/trusted-check.mjs publish
