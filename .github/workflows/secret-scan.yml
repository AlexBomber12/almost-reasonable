name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  gitleaks:
    # After installation, PR scans run from main's trusted workflow definition.
    # The direct PR run is only for this initial installation on the fixed base.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.sha == 'c2054cb909b30527c3ec6d5ac3a041c3597b245a') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted scanner revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.sha || github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: scanner
      - name: Check out complete history at evaluated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: target
      - name: Test scanner regressions and scan fetched history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          if [[ -f scanner/scripts/security/scan-secrets.sh ]]; then
            source_dir=scanner
          elif [[ "$BASE_SHA" == c2054cb909b30527c3ec6d5ac3a041c3597b245a ]]; then
            # Initial installation only: the verified base predates this scanner.
            source_dir=target
          else
            echo 'Trusted scanner scripts are missing from the base revision' >&2
            exit 1
          fi
          bash "$source_dir/scripts/security/test-secret-scan.sh"
          bash "$source_dir/scripts/security/scan-secrets.sh" target
