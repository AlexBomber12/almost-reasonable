name: almost-reasonable-private-pilot

services:
  provider-worker:
    build:
      context: ..
      dockerfile: ops/Dockerfile.private-pilot-worker
    image: almost-reasonable-private-pilot-worker:local
    user: "${PILOT_WORKER_UID:-11021}:${PILOT_WORKER_GID:-11021}"
    group_add: ["${PILOT_IPC_GID:-11020}"]
    command:
      - python
      - -B
      - -m
      - app.trusted.private_pilot_worker
      - --socket
      - /run/pilot-ipc/worker.sock
      - --provider-database
      - /var/lib/pilot-worker/provider.sqlite3
      - --allowance-database
      - /var/lib/pilot-worker/allowance.sqlite3
      - --socket-group-gid
      - "${PILOT_IPC_GID:-11020}"
    read_only: true
    networks: [provider-egress]
    volumes:
      - type: bind
        source: ${PILOT_SOCKET_DIR:?set protected socket directory}
        target: /run/pilot-ipc
        bind: {create_host_path: false}
      - type: bind
        source: ${PILOT_WORKER_STATE_DIR:?set worker state directory}
        target: /var/lib/pilot-worker
        bind: {create_host_path: false}
      - type: bind
        source: ${PILOT_CONTROL_DIR:?set protected worker control directory}
        target: /run/almost-reasonable-private-pilot/control
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PILOT_SECRET_DIR:?set protected worker secret directory}
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 10s

  private-app:
    build:
      context: ..
      dockerfile: ops/Dockerfile.private-pilot-app
    image: almost-reasonable-private-pilot-app:local
    user: "${PILOT_APP_UID:-11022}:${PILOT_APP_GID:-11022}"
    group_add: ["${PILOT_IPC_GID:-11020}"]
    command:
      - python
      - -B
      - -m
      - app.private_web.cli
      - serve
      - --auth-db
      - /var/lib/pilot-app/auth.db
      - --event-db
      - /var/lib/pilot-app/events.db
      - --privacy-ledger
      - /var/lib/pilot-app/ledger.db
      - --owner-directory
      - /var/lib/pilot-app/owner
      - --ipc-state-db
      - /var/lib/pilot-app/ipc-state.db
      - --worker-socket
      - /run/pilot-ipc/worker.sock
      - --worker-uid
      - "${PILOT_WORKER_UID:-11021}"
      - --listen-host
      - 0.0.0.0
      - --port
      - "8000"
      - --allowed-host
      - "${PILOT_ALLOWED_HOST:?set approved HTTPS host}"
      - --allowed-origin
      - "${PILOT_ALLOWED_ORIGIN:?set approved HTTPS origin}"
    read_only: true
    networks: [app-local]
    ports: ["127.0.0.1:18022:8000"]
    volumes:
      - type: bind
        source: ${PILOT_SOCKET_DIR:?set protected socket directory}
        target: /run/pilot-ipc
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PILOT_APP_STATE_DIR:?set application state directory}
        target: /var/lib/pilot-app
        bind: {create_host_path: false}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m

networks:
  app-local:
    internal: true
  provider-egress:
    driver: bridge
