name: almost-reasonable-openai-stage0

services:
  openai-worker:
    image: almost-reasonable-openai-worker-stage0:local
    build:
      context: ..
      dockerfile: ops/Dockerfile.openai-worker-stage0
    user: "${STAGE0_WORKER_UID:-11001}:${STAGE0_WORKER_GID:-11001}"
    group_add:
      - "${STAGE0_IPC_GID:-11000}"
    command:
      - python
      - -B
      - -m
      - app.trusted.openai_worker_server
      - --socket
      - /run/almost-reasonable/openai-worker.sock
      - --database
      - /var/lib/almost-reasonable/provider.sqlite3
      - --allow-uid
      - "${STAGE0_PLANNER_UID:-11002}"
      - --socket-group-gid
      - "${STAGE0_IPC_GID:-11000}"
      - --log-peer-uids
    read_only: true
    network_mode: none
    volumes:
      - type: bind
        source: ${STAGE0_SOCKET_DIR:?set STAGE0_SOCKET_DIR to an absolute precreated directory}
        target: /run/almost-reasonable
        bind:
          create_host_path: false
      - type: bind
        source: ${STAGE0_DATABASE_DIR:?set STAGE0_DATABASE_DIR to an absolute precreated directory}
        target: /var/lib/almost-reasonable
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-B", "-c", "import os, stat; p='/run/almost-reasonable/openai-worker.sock'; s=os.lstat(p) if os.path.lexists(p) else None; raise SystemExit(0 if s is not None and stat.S_ISSOCK(s.st_mode) and stat.S_IMODE(s.st_mode) == 0o660 and s.st_uid == os.geteuid() else 1)"]
      interval: 1s
      timeout: 2s
      retries: 30

  planner-probe:
    image: almost-reasonable-openai-worker-stage0:local
    user: "${STAGE0_PLANNER_UID:-11002}:${STAGE0_PLANNER_GID:-11002}"
    group_add:
      - "${STAGE0_IPC_GID:-11000}"
    command:
      - python
      - -B
      - -m
      - app.ops.openai_worker_probe
      - --socket
      - /run/almost-reasonable/openai-worker.sock
    read_only: true
    network_mode: none
    volumes:
      - type: bind
        source: ${STAGE0_SOCKET_DIR:?set STAGE0_SOCKET_DIR to an absolute precreated directory}
        target: /run/almost-reasonable
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 128m
